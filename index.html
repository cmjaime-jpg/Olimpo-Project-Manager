<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>Olimpo Project Manager</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3ead6;background:#101014}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;border-bottom:1px solid #42351b;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(21px,4vw,32px);margin:0;color:#e9be61}h2{font-size:21px}small,.muted{color:#aaa49b}main{max-width:1100px;margin:auto;padding:24px 5%}button{border:0;border-radius:9px;padding:11px 15px;background:#d4a94f;color:#19140c;font-weight:700;cursor:pointer}button.secondary{background:#29272a;color:#f1dfb8;border:1px solid #665431}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{background:#1c1b20;border:1px solid #4b3b23;border-radius:15px;padding:18px}.card h3{margin:6px 0}.stat{font-size:27px;font-weight:800;color:#e9be61}.bar{height:9px;background:#39363b;border-radius:12px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#d4a94f}input,textarea,select{width:100%;padding:12px;background:#27252b;border:1px solid #675533;border-radius:9px;color:white;font:inherit}label{display:block;margin:13px 0 6px}dialog{background:#1b1a1f;color:#f3ead6;border:1px solid #b18c43;border-radius:15px;width:min(94vw,520px)}dialog::backdrop{background:#000b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.task{padding:12px 0;border-bottom:1px solid #39343a;display:flex;gap:10px;align-items:center}.task input{width:auto}.tag{font-size:12px;color:#dfbc74}#notice{color:#bcb3a3;font-size:13px;margin-top:20px}</style></head>
<body><header><div><h1>◆ OLIMPO</h1><small>PROJECT MANAGER</small></div><button onclick="openProject()">+ Proyecto</button></header><main><h2>Panel de proyectos</h2><section class="grid" id="stats"></section><h2>Mis proyectos</h2><section class="grid" id="projects"></section><p id="notice">Versión inicial: los datos se guardan localmente en este dispositivo. Aún no están sincronizados con Supabase.</p></main>
<dialog id="projectDialog"><form id="projectForm"><h2>Nuevo proyecto</h2><label>Nombre</label><input name="name" required maxlength="100"><label>Descripción</label><textarea name="description" rows="3"></textarea><label>Fecha objetivo</label><input type="date" name="due"><div class="actions"><button type="submit">Guardar proyecto</button><button type="button" class="secondary" onclick="projectDialog.close()">Cancelar</button></div></form></dialog>
<dialog id="detailDialog"><h2 id="detailTitle"></h2><p class="muted" id="detailDesc"></p><div id="tasks"></div><form id="taskForm"><label>Nueva tarea</label><input name="title" placeholder="Ej. Definir requisitos" required maxlength="120"><label>Prioridad</label><select name="priority"><option>Media</option><option>Alta</option><option>Baja</option></select><div class="actions"><button type="submit">Añadir tarea</button><button type="button" class="secondary" onclick="detailDialog.close()">Cerrar</button></div></form></dialog>
<script>
const key='olimpo_pm_v1';const seed=[{id:1,name:'Olimpo Ventas',description:'Rutas, inventario y facturación',due:'',tasks:[]},{id:2,name:'Helados Disfruta',description:'Formulaciones y distribución',due:'',tasks:[]},{id:3,name:'Pintura vial',description:'Ensayos y validación',due:'',tasks:[]}];let projects;try{projects=JSON.parse(localStorage.getItem(key))||seed}catch{projects=seed}let selected=null;const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(key,JSON.stringify(projects));render()};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100):0;
function render(){const all=projects.flatMap(p=>p.tasks);$('stats').innerHTML=[['Proyectos',projects.length],['Tareas pendientes',all.filter(t=>!t.done).length],['Tareas completadas',all.filter(t=>t.done).length]].map(([n,v])=>'<div class="card"><div class="muted">'+n+'</div><div class="stat">'+v+'</div></div>').join('');$('projects').innerHTML=projects.map(p=>'<article class="card"><div class="tag">'+(p.due?'Meta: '+esc(p.due):'Sin fecha objetivo')+'</div><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description)+'</p><div class="bar"><div class="fill" style="width:'+pct(p)+'%"></div></div><p>'+pct(p)+'% completado · '+p.tasks.length+' tareas</p><button data-id="'+p.id+'">Abrir proyecto</button></article>').join('');$('projects').querySelectorAll('button').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.id)))}
function openProject(){$('projectForm').reset();$('projectDialog').showModal()}$('projectForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);projects.push({id:Date.now(),name:f.get('name').trim(),description:f.get('description').trim(),due:f.get('due'),tasks:[]});save();$('projectDialog').close()};
function openDetail(id){selected=id;drawTasks();$('detailDialog').showModal()}function drawTasks(){const p=projects.find(p=>p.id===selected);if(!p)return;$('detailTitle').textContent=p.name;$('detailDesc').textContent=p.description;$('tasks').innerHTML=p.tasks.length?p.tasks.map(t=>'<div class="task"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'><span style="'+(t.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(t.title)+' <span class="tag">('+esc(t.priority)+')</span></span></div>').join(''):'<p class="muted">Todavía no hay tareas.</p>';$('tasks').querySelectorAll('input').forEach(c=>c.onchange=()=>{p.tasks.find(t=>t.id===Number(c.dataset.task)).done=c.checked;save();drawTasks()})}
$('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p=projects.find(p=>p.id===selected);p.tasks.push({id:Date.now(),title:f.get('title').trim(),priority:f.get('priority'),done:false});e.target.reset();save();drawTasks()};render();
</script></body></html>
