<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101014"><title>Olimpo Project Manager</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f3ead6;background:#101014}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;border-bottom:1px solid #42351b;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(21px,4vw,32px);margin:0;color:#e9be61}h2{font-size:21px}small,.muted{color:#aaa49b}main{max-width:1100px;margin:auto;padding:24px 5%}button{border:0;border-radius:9px;padding:11px 15px;background:#d4a94f;color:#19140c;font-weight:700;cursor:pointer}button.secondary{background:#29272a;color:#f1dfb8;border:1px solid #665431}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{background:#1c1b20;border:1px solid #4b3b23;border-radius:15px;padding:18px}.card h3{margin:6px 0}.stat{font-size:27px;font-weight:800;color:#e9be61}.bar{height:9px;background:#39363b;border-radius:12px;overflow:hidden;margin:14px 0}.fill{height:100%;background:#d4a94f}input,textarea,select{width:100%;padding:12px;background:#27252b;border:1px solid #675533;border-radius:9px;color:white;font:inherit}label{display:block;margin:13px 0 6px}.stage{font-size:14px;color:#e9be61;padding:14px 0 6px;border-bottom:1px solid #715728;font-weight:700}.task{align-items:flex-start}.task input[type="checkbox"]{width:20px;height:20px;accent-color:#d4a94f;flex:none}.task span{line-height:1.4}.references{font-size:12px;margin:10px 0}.references a{color:#e9be61}dialog{background:#1b1a1f;color:#f3ead6;border:1px solid #b18c43;border-radius:15px;width:min(94vw,520px)}dialog::backdrop{background:#000b}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.task{padding:12px 0;border-bottom:1px solid #39343a;display:flex;gap:10px;align-items:center}.task input{width:auto}.tag{font-size:12px;color:#dfbc74}#notice{color:#bcb3a3;font-size:13px;margin-top:20px}</style></head>
<body><header><div><h1>◆ OLIMPO</h1><small>PROJECT MANAGER</small></div><button onclick="openProject()">+ Proyecto</button></header><main><h2>Panel de proyectos</h2><section class="grid" id="stats"></section><h2>Mis proyectos</h2><section class="grid" id="projects"></section><p id="notice">Versión inicial: los datos se guardan localmente en este dispositivo. Aún no están sincronizados con Supabase.</p></main>
<dialog id="projectDialog"><form id="projectForm"><h2>Nuevo proyecto</h2><label>Nombre</label><input name="name" required maxlength="100"><label>Descripción</label><textarea name="description" rows="3"></textarea><label>Fecha objetivo</label><input type="date" name="due"><div class="actions"><button type="submit">Guardar proyecto</button><button type="button" class="secondary" onclick="projectDialog.close()">Cancelar</button></div></form></dialog>
<dialog id="detailDialog"><h2 id="detailTitle"></h2><p class="muted" id="detailDesc"></p><div id="detailReferences" class="references"></div><div id="tasks"></div><form id="taskForm"><label>Nueva tarea</label><input name="title" placeholder="Ej. Definir requisitos" required maxlength="120"><label>Prioridad</label><select name="priority"><option>Media</option><option>Alta</option><option>Baja</option></select><div class="actions"><button type="submit">Añadir tarea</button><button type="button" class="secondary" onclick="detailDialog.close()">Cerrar</button></div></form></dialog>
<script>
const key='olimpo_pm_v1';const seed=[{id:1,name:'Olimpo Ventas',description:'Rutas, inventario y facturación',due:'',tasks:[]},{id:2,name:'Helados Disfruta',description:'Formulaciones y distribución',due:'',tasks:[]},{id:3,name:'Pintura vial',description:'Ensayos y validación',due:'',tasks:[]}];let projects;try{projects=JSON.parse(localStorage.getItem(key))||seed}catch{projects=seed}const additions=[{id:4,name:'API SII — Facturación Electrónica',description:'Requisitos SII, certificados, DTE e integración con Olimpo Ventas',due:'',tasks:[]},{id:5,name:'Gestor de Formulaciones',description:'Recetas, costos y diseño de experimentos',due:'',tasks:[]},{id:6,name:'Olimpo Compras',description:'Compras con IA para todos los rubros, creación de productos, recepción e inventario',due:'',tasks:[]}];for(const p of additions){if(!projects.some(x=>x.name===p.name))projects.push(p)}
const siiRoadmap=[["01 · Preparación","Definir documentos SII: facturas afectas, exentas, notas de crédito y boletas"],["01 · Preparación","Verificar emisor electrónico, RUT, representante y permisos SII"],["01 · Preparación","Gestionar certificado digital válido, custodia y renovación"],["01 · Preparación","Confirmar requisitos vigentes de sistema propio y proceso de certificación"],["02 · Seguridad y arquitectura","Diseñar servicio API separado de Olimpo Ventas"],["02 · Seguridad y arquitectura","Implementar autorización, control de roles, secretos, auditoría y respaldos"],["02 · Seguridad y arquitectura","Diseñar modelo de datos: DTE, CAF, folios, XML y estados"],["02 · Seguridad y arquitectura","Definir IVA, exenciones, descuentos y redondeos"],["03 · Emisión DTE","Generar XML según esquemas vigentes del SII"],["03 · Emisión DTE","Implementar firma digital y timbre electrónico"],["03 · Emisión DTE","Gestionar CAF y folios exclusivos sin duplicaciones"],["03 · Emisión DTE","Implementar factura electrónica afecta y exenta"],["03 · Emisión DTE","Implementar notas de crédito y débito"],["03 · Emisión DTE","Planificar emisión de boletas y guías de despacho"],["04 · Comunicación SII","Enviar DTE y registrar identificador de envío"],["04 · Comunicación SII","Consultar estados y respuestas: aceptación, reparos y rechazo"],["04 · Comunicación SII","Implementar reintentos idempotentes, contingencias y registro de errores"],["04 · Comunicación SII","Implementar intercambio de XML y acuses de recibo cuando corresponda"],["05 · Certificación","Solicitar acceso al ambiente de certificación SII"],["05 · Certificación","Completar set de pruebas y set de simulación"],["05 · Certificación","Completar set de intercambio y muestras de impresión"],["05 · Certificación","Presentar declaración de cumplimiento y obtener habilitación en producción"],["06 · Olimpo Ventas","Integrar emisión con clientes, pedidos, descuentos, ventas y pagos"],["06 · Olimpo Ventas","Crear representación de factura y descarga XML y PDF"],["06 · Olimpo Ventas","Probar notas de crédito, IVA, exentos y anulaciones"],["07 · Operación y comercialización","Revisar con contador respaldos y Registro de Compras y Ventas"],["07 · Operación y comercialización","Ejecutar piloto de emisión con monitoreo y control"],["07 · Operación y comercialización","Diseñar evolución comercial multicliente con separación segura por empresa"]];
const comprasRoadmap=[["01 · Documentos","Fotografiar facturas en papel e importar documentos recibidos"],["01 · Documentos","Extraer con IA proveedor, RUT, folio, fecha, neto, IVA, total y productos"],["01 · Documentos","Exigir revisión y aprobación antes de guardar compras"],["01 · Documentos","Detectar duplicados por RUT, tipo de documento y folio"],["02 · Compras multirrubro","Habilitar rubros Distribución, Disfruta, Pinturas, Pisos industriales, Hormigón y General"],["02 · Compras multirrubro","Asignar rubro a cada línea de factura, incluso distintos rubros en una misma factura"],["02 · Compras multirrubro","Diferenciar materias primas, productos para reventa, embalajes y gastos"],["02 · Compras multirrubro","Generar reportes de compras por rubro, proveedor y proyecto"],["03 · Productos nuevos","Buscar coincidencias con inventario por nombre, código de barras y proveedor"],["03 · Productos nuevos","Generar ficha borrador automáticamente para productos que no existan"],["03 · Productos nuevos","Aprobar código, nombre, categoría, unidad, costo y rubro antes de crear producto"],["03 · Productos nuevos","No inventar precio de venta: dejar el producto pendiente y no vendible hasta revisarlo"],["04 · Inventario y recepción","Vincular compras con órdenes de compra a proveedores"],["04 · Inventario y recepción","Permitir recepción parcial y diferencias entre factura y mercadería recibida"],["04 · Inventario y recepción","Incrementar stock una sola vez al aprobar unidades recibidas, incluso nuevos productos"],["04 · Inventario y recepción","Registrar historial de compras y costos y movimientos de stock por rubro"],["05 · Integraciones","Conectar costos aprobados de materias primas con Olimpo Fórmulas"],["05 · Integraciones","Registrar deudas con proveedores y pagos parciales"],["05 · Integraciones","Conciliar facturas electrónicas con registros SII cuando corresponda"]];
function attachRoadmap(name,roadmap,prefix,idBase){
 const p=projects.find(x=>x.name===name);if(!p)return;
 if(!Array.isArray(p.tasks))p.tasks=[];
 roadmap.forEach(([phase,title],i)=>{
 const planKey=prefix+String(i+1);
 if(!p.tasks.some(t=>t.planKey===planKey||t.title===title))p.tasks.push({id:idBase+i,planKey,phase,title,priority:i<9?'Alta':'Media',done:false});
 });
}
attachRoadmap('API SII — Facturación Electrónica',siiRoadmap,'sii2026-',44001);
attachRoadmap('Olimpo Compras',comprasRoadmap,'compras2026-',46001);
localStorage.setItem(key,JSON.stringify(projects));let selected=null;const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(key,JSON.stringify(projects));render()};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pct=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.done).length/p.tasks.length*100):0;
function render(){const all=projects.flatMap(p=>p.tasks);$('stats').innerHTML=[['Proyectos',projects.length],['Tareas pendientes',all.filter(t=>!t.done).length],['Tareas completadas',all.filter(t=>t.done).length]].map(([n,v])=>'<div class="card"><div class="muted">'+n+'</div><div class="stat">'+v+'</div></div>').join('');$('projects').innerHTML=projects.map(p=>'<article class="card"><div class="tag">'+(p.due?'Meta: '+esc(p.due):'Sin fecha objetivo')+'</div><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description)+'</p><div class="bar"><div class="fill" style="width:'+pct(p)+'%"></div></div><p>'+pct(p)+'% completado · '+p.tasks.length+' tareas</p><button data-id="'+p.id+'">Abrir proyecto</button></article>').join('');$('projects').querySelectorAll('button').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.id)))}
function openProject(){$('projectForm').reset();$('projectDialog').showModal()}$('projectForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);projects.push({id:Date.now(),name:f.get('name').trim(),description:f.get('description').trim(),due:f.get('due'),tasks:[]});save();$('projectDialog').close()};
function openDetail(id){selected=id;drawTasks();$('detailDialog').showModal()}
function drawTasks(){
 const p=projects.find(x=>x.id===selected);if(!p)return;
 $('detailTitle').textContent=p.name;
 $('detailDesc').textContent=p.description+' · '+pct(p)+'% completado ('+p.tasks.filter(t=>t.done).length+'/'+p.tasks.length+' tareas)';
 $('detailReferences').innerHTML=p.name==='API SII — Facturación Electrónica'?'<a target="_blank" rel="noopener" href="https://www.sii.cl/factura_electronica/factura_mercado/proceso_certificacion.htm">Certificación SII</a> · <a target="_blank" rel="noopener" href="https://www.sii.cl/servicios_online/1039-formato_xml-1184.html">Formatos XML vigentes</a>':p.name==='Olimpo Compras'?'Compras de diferentes rubros en una misma factura, siempre con aprobación antes de actualizar inventario.':'';
 let prev='';
 $('tasks').innerHTML=p.tasks.length?p.tasks.map(t=>{
  const phase=t.phase||'Otras tareas';const group=phase!==prev?'<div class="stage">'+esc(phase)+'</div>':'';prev=phase;
  return group+'<label class="task"><input type="checkbox" data-task="'+t.id+'" '+(t.done?'checked':'')+'><span style="'+(t.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(t.title)+' <span class="tag">('+esc(t.priority)+')</span></span></label>';
 }).join(''):'<p class="muted">Todavía no hay tareas.</p>';
 $('tasks').querySelectorAll('input').forEach(c=>c.onchange=()=>{
 const t=p.tasks.find(t=>t.id===Number(c.dataset.task));if(!t)return;t.done=c.checked;save();drawTasks();
 });
}
$('taskForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p=projects.find(p=>p.id===selected);p.tasks.push({id:Date.now(),title:f.get('title').trim(),priority:f.get('priority'),done:false});e.target.reset();save();drawTasks()};render();
</script></body></html>
